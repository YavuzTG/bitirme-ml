name: Convert Keras to TFLite

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r masaustu/requirements.txt

      - name: Run conversion script
        run: |
          python masaustu/convert_to_tflite.py --output mobile_app/assets/model_cnn.tflite

      - name: Commit and push TFLite artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mobile_app/assets/model_cnn.tflite || true
          git add mobile_app/assets/model_lstm.tflite || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add generated TFLite models (CI)"
            git push
          fi