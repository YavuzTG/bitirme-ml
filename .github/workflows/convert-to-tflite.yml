name: Convert Keras to TFLite

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pinned binary-compatible dependencies
        run: |
          python -m pip install --upgrade pip
          # Install numpy/h5py/scikit-learn/joblib first (binary-compat with TF)
          pip install "numpy==1.23.5" "h5py==3.8.0" "scikit-learn==1.2.2" "joblib==1.1.0" "pandas==1.5.3"
          # Install matching TensorFlow wheel
          pip install "tensorflow==2.15.1"
          # Install remaining requirements without pulling deps that would upgrade numpy
          pip install --no-deps -r masaustu/requirements.txt || true

      - name: Verify Python / TensorFlow
        run: |
          python -V
          python -c "import sys, tensorflow as tf; print('tf', tf.__version__)
          import numpy as np; print('np', np.__version__)"

      - name: Run conversion script
        run: |
          python masaustu/convert_to_tflite.py --output mobile_app/assets/model_cnn.tflite

      - name: List generated files (debug)
        run: |
          echo "Workspace files:" && ls -la
          echo "Assets directory:" && ls -la mobile_app/assets || true

      - name: Upload TFLite artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tflite-models
          path: |
            mobile_app/assets/model_cnn.tflite
            mobile_app/assets/model_lstm.tflite

      - name: Commit and push TFLite artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mobile_app/assets/model_cnn.tflite || true
          git add mobile_app/assets/model_lstm.tflite || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add generated TFLite models (CI)"
            git push
          fi